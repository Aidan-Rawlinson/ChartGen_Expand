[pytest]
testpaths = tests
pythonpath = .

# --import-mode=importlib is required, not a preference. Seventeen module
# basenames are duplicated across chartgen/ (xlsx_reader.py, resolve.py,
# state.py, preview.py, constants.py and more). Because tests/ mirrors the
# package layout, the matching test filenames are duplicated too, and
# pytest's default "prepend" import mode cannot tell two same-named test
# modules apart -- it fails at collection before running anything.
addopts = --import-mode=importlib -q
